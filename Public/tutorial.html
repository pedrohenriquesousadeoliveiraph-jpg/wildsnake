<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WildSnake - Tutorial v13.29</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#01040b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#01040b}
#loading strong{display:block;font-size:28px;letter-spacing:4px}
#loading span{display:block;margin-top:10px;color:#6bffab;font-size:10px;letter-spacing:3px}
#error{display:none;max-width:520px;padding:24px;color:#ff8d9b;line-height:1.5}
</style>
</head>
<body>
<div id="loading">
  <div>
    <strong>WILDSNAKE</strong>
    <span>CARREGANDO TUTORIAL v13.29</span>
    <div id="error"></div>
  </div>
</div>
<script>
(async()=>{
  const SOURCE="https://wildsnake.onrender.com/tutorial.html";
  const PATCH="/* =========================================================\n   WILDSNAKE TUTORIAL WEB v13.29\n   FOCO INICIAL: MINHOCA -> COMIDAS -> COME\n   ---------------------------------------------------------\n   COLE ESTE BLOCO DEPOIS DA FUN\u00c7\u00c3O showMessage()\n   E ANTES DE startTutorial().\n========================================================= */\n\n(function installWildSnakeOpeningFocus(){\n\n    /*\n       Mantemos a fun\u00e7\u00e3o original.\n       O restante do tutorial continua usando showMessage()\n       exatamente como antes.\n    */\n    const originalShowMessage =\n        showMessage;\n\n\n    function getFocusElement(){\n\n        return document\n            .getElementById(\n                \"focusEffect\"\n            );\n\n    }\n\n\n    function getCinemaFlash(){\n\n        return document\n            .getElementById(\n                \"cinemaFlash\"\n            );\n\n    }\n\n\n    function focusCameraOnPoint(\n        x,\n        y,\n        zoom = 1.24\n    ){\n\n        camera.targetZoom =\n            zoom;\n\n\n        camera.targetX =\n            x -\n            width*.5;\n\n\n        camera.targetY =\n            y -\n            height*.5;\n\n    }\n\n\n    function focusCameraOnPlayer(){\n\n        if(\n            !player\n        ){\n            return;\n        }\n\n\n        focusCameraOnPoint(\n            player.x,\n            player.y,\n            1.28\n        );\n\n    }\n\n\n    function getTutorialFoodCenter(){\n\n        /*\n           No come\u00e7o do tutorial foods foi zerado,\n           ent\u00e3o neste momento os itens existentes\n           s\u00e3o justamente as 5 comidas da demonstra\u00e7\u00e3o.\n        */\n        const liveFoods =\n            foods.filter(\n                food =>\n                    food &&\n                    !food.dead &&\n                    Number.isFinite(\n                        food.x\n                    ) &&\n                    Number.isFinite(\n                        food.y\n                    )\n            );\n\n\n        if(\n            !liveFoods.length\n        ){\n\n            return {\n                x:\n                    width*.59,\n\n                y:\n                    height*.47\n            };\n\n        }\n\n\n        let minX =\n            Infinity;\n\n        let maxX =\n            -Infinity;\n\n        let minY =\n            Infinity;\n\n        let maxY =\n            -Infinity;\n\n\n        liveFoods.forEach(\n            food => {\n\n                minX =\n                    Math.min(\n                        minX,\n                        food.x\n                    );\n\n\n                maxX =\n                    Math.max(\n                        maxX,\n                        food.x\n                    );\n\n\n                minY =\n                    Math.min(\n                        minY,\n                        food.y\n                    );\n\n\n                maxY =\n                    Math.max(\n                        maxY,\n                        food.y\n                    );\n\n            }\n        );\n\n\n        return {\n\n            x:\n                (\n                    minX +\n                    maxX\n                )*.5,\n\n            y:\n                (\n                    minY +\n                    maxY\n                )*.5\n\n        };\n\n    }\n\n\n    async function focusPlayerIntroduction(){\n\n        /*\n           A minhoca fica REALMENTE parada.\n           updateWorld() j\u00e1 respeita worldPaused,\n           enquanto updateCamera() continua funcionando.\n        */\n        worldPaused =\n            true;\n\n\n        if(\n            player\n        ){\n\n            player.foodTarget =\n                null;\n\n\n            player.controller =\n                \"drift\";\n\n        }\n\n\n        focusCameraOnPlayer();\n\n\n        getFocusElement()\n            ?.classList\n            .add(\n                \"show\"\n            );\n\n\n        /*\n           Primeiro a c\u00e2mera termina de aproximar.\n           Depois aparece a mensagem.\n        */\n        await sleep(\n            850\n        );\n\n    }\n\n\n    async function focusFoodIntroduction(){\n\n        /*\n           Continua congelado.\n           A minhoca N\u00c3O pode sair andando enquanto\n           apresentamos as comidas.\n        */\n        worldPaused =\n            true;\n\n\n        if(\n            player\n        ){\n\n            player.foodTarget =\n                null;\n\n        }\n\n\n        const center =\n            getTutorialFoodCenter();\n\n\n        /*\n           Zoom um pouco menor que o da minhoca\n           para enquadrar as cinco energias juntas.\n        */\n        focusCameraOnPoint(\n            center.x,\n            center.y,\n            1.18\n        );\n\n\n        getFocusElement()\n            ?.classList\n            .add(\n                \"show\"\n            );\n\n\n        await sleep(\n            850\n        );\n\n    }\n\n\n    async function releaseFoodFocus(){\n\n        const flash =\n            getCinemaFlash();\n\n\n        flash\n            ?.classList\n            .add(\n                \"show\"\n            );\n\n\n        await sleep(\n            280\n        );\n\n\n        /*\n           Volta para a vis\u00e3o normal.\n        */\n        camera.targetZoom =\n            1;\n\n\n        camera.targetX =\n            0;\n\n\n        camera.targetY =\n            0;\n\n\n        getFocusElement()\n            ?.classList\n            .remove(\n                \"show\"\n            );\n\n\n        await sleep(\n            470\n        );\n\n\n        flash\n            ?.classList\n            .remove(\n                \"show\"\n            );\n\n\n        /*\n           S\u00f3 AGORA liberamos a minhoca.\n           Na sequ\u00eancia normal de startTutorial()\n           ela recebe controller = \"eatTutorial\"\n           e come\u00e7a a pegar as comidas.\n        */\n        worldPaused =\n            false;\n\n    }\n\n\n    showMessage =\n        async function(\n            tag,\n            title,\n            description,\n            duration\n        ){\n\n            /* =================================================\n               1. ESTA \u00c9 SUA MINHOCA\n            ================================================= */\n\n            if(\n                title ===\n                \"ESTA \u00c9 SUA MINHOCA\"\n            ){\n\n                await focusPlayerIntroduction();\n\n\n                await originalShowMessage(\n\n                    tag,\n                    title,\n                    description,\n                    duration\n\n                );\n\n\n                /*\n                   N\u00c3O descongela aqui.\n                   Ela permanece parada enquanto\n                   as comidas s\u00e3o criadas.\n                */\n                return;\n\n            }\n\n\n            /* =================================================\n               2. ESTAS S\u00c3O AS COMIDAS\n            ================================================= */\n\n            if(\n                title ===\n                \"ESTAS S\u00c3O AS COMIDAS\"\n            ){\n\n                await focusFoodIntroduction();\n\n\n                await originalShowMessage(\n\n                    tag,\n                    title,\n                    description,\n                    duration\n\n                );\n\n\n                await releaseFoodFocus();\n\n\n                return;\n\n            }\n\n\n            /*\n               Todas as outras mensagens do tutorial\n               continuam 100% iguais.\n            */\n            return originalShowMessage(\n\n                tag,\n                title,\n                description,\n                duration\n\n            );\n\n        };\n\n})();\n";
  const error=document.getElementById("error");
  try{
    const response=await fetch(SOURCE,{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    let html=await response.text();

    const marker="async function startTutorial(){";
    const pos=html.indexOf(marker);
    if(pos<0) throw new Error("Não encontrei startTutorial() no tutorial atual.");

    html=html.slice(0,pos)+"\n"+PATCH+"\n\n"+html.slice(pos);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    error.style.display="block";
    error.textContent="Não foi possível carregar o tutorial base: "+(err?.message||err);
  }
})();
</script>
</body>
</html>
