<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090b">
<title>WildSnake • Tutorial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03090b;--panel:#0b151a;--line:rgba(255,255,255,.09);
  --green:#35e69b;--green2:#20c98c;--text:#eef5f3;--muted:#84969e;
  --purple:#b184ff;--gold:#ffd35a;
}
html,body{min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:
radial-gradient(circle at 50% 40%,rgba(17,117,75,.15),transparent 35%),
radial-gradient(circle at 18% 75%,rgba(75,88,255,.09),transparent 30%),
linear-gradient(180deg,#041012,#010506)}
.logo-bg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:clamp(70px,13vw,190px);font-weight:1000;letter-spacing:-8px;color:rgba(53,230,155,.08);white-space:nowrap}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 14px currentColor;animation:float 6s ease-in-out infinite alternate}
.d1{left:10%;top:20%;color:#35e69b}.d2{left:75%;top:13%;color:#ffd35a;animation-delay:-2s}.d3{left:85%;top:68%;color:#b184ff;animation-delay:-4s}.d4{left:34%;top:80%;color:#40b9ff;animation-delay:-1s}.d5{left:58%;top:30%;color:#ff5fa5;animation-delay:-3s}
@keyframes float{from{transform:translate(-10px,-8px) scale(.6);opacity:.35}to{transform:translate(20px,18px) scale(1.4);opacity:1}}

.wrap{position:relative;z-index:2;min-height:100dvh;display:grid;place-items:center;padding:20px}
.card{width:min(780px,96vw);padding:24px;border:1px solid var(--line);border-radius:26px;background:rgba(8,17,21,.88);backdrop-filter:blur(16px);box-shadow:0 40px 120px rgba(0,0,0,.55)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.brand{font-size:21px;font-weight:1000;color:var(--green)} .brand span{color:#fff}
.room-chip{padding:8px 11px;border:1px solid rgba(177,132,255,.24);border-radius:999px;background:rgba(177,132,255,.07);color:#cdb1ff;font-size:9px;font-weight:1000}
.progress{height:7px;border-radius:99px;background:#111d22;overflow:hidden;margin-bottom:22px}
.progress>i{display:block;height:100%;width:16%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:inherit;transition:.45s ease}
.stage{text-align:center;min-height:390px;display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--green);font-size:8px;font-weight:1000;letter-spacing:1.5px}
h1{margin:7px 0 9px;font-size:clamp(26px,5vw,44px);line-height:1;font-weight:1000}
.desc{max-width:560px;margin:0 auto 20px;color:var(--muted);font-size:11px;line-height:1.65}

.demo{position:relative;width:min(560px,90%);height:170px;margin:0 auto 22px;border:1px solid rgba(53,230,155,.14);border-radius:20px;overflow:hidden;background:
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),#06100d;background-size:32px 32px}
.snake{position:absolute;left:50%;top:50%;display:flex;align-items:center;transform:translate(-50%,-50%);animation:snakeMove 3s ease-in-out infinite alternate}
.snake i,.snake b{width:27px;height:27px;margin-left:-7px;border-radius:50%;background:var(--green);box-shadow:0 0 13px rgba(53,230,155,.35)}
.snake b{width:31px;height:31px;position:relative}
.snake b:before,.snake b:after{content:"";position:absolute;top:8px;width:7px;height:8px;border-radius:50%;background:#fff}
.snake b:before{left:6px}.snake b:after{right:6px}
@keyframes snakeMove{from{transform:translate(-70%,-55%) rotate(-7deg)}to{transform:translate(-25%,-20%) rotate(8deg)}}

.food{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd35a;box-shadow:0 0 12px #ffd35a;animation:foodPulse 1s ease-in-out infinite alternate}
.f1{left:18%;top:25%}.f2{right:18%;top:67%;background:#ff5f82;box-shadow:0 0 12px #ff5f82}.f3{left:68%;top:25%;background:#48baff;box-shadow:0 0 12px #48baff}
@keyframes foodPulse{to{transform:scale(1.45)}}

.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.key{min-width:48px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#101a20;color:#cbd7db;font-size:9px;font-weight:1000}
.action{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:50px;border-radius:13px;font-weight:1000;font-size:10px}
.secondary{border:1px solid var(--line);background:#10191e;color:#d7e0e4}
.primary{border:0;background:linear-gradient(180deg,#47efb5,#21ca90);color:#02110b}
.status{min-height:18px;margin:12px 0 0;text-align:center;color:#8fa1a9;font-size:9px}.status.error{color:#ff7f92}

.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px auto 20px;max-width:600px}
.reward-card{min-height:150px;border:1px solid rgba(177,132,255,.18);border-radius:18px;background:linear-gradient(180deg,rgba(177,132,255,.08),rgba(8,14,18,.9));display:grid;place-items:center;color:#d4b8ff;font-size:38px;transition:.18s}
.reward-card:hover{transform:translateY(-3px);border-color:rgba(177,132,255,.42)}
.reward-card.selected{border-color:var(--gold);box-shadow:0 0 30px rgba(255,211,90,.12);color:var(--gold)}
.reward-result{margin:0 auto 20px;max-width:540px;padding:18px;border:1px solid rgba(255,211,90,.18);border-radius:17px;background:rgba(255,211,90,.05)}
.reward-result strong{display:block;color:var(--gold);font-size:22px;margin-bottom:5px}.reward-result span{color:#9b9174;font-size:10px}
.finish-icon{font-size:60px;margin-bottom:10px}
@media(max-width:600px){
  .wrap{align-items:start;padding:10px}
  .card{padding:17px 13px;min-height:calc(100dvh - 20px);border-radius:20px}
  .stage{min-height:calc(100dvh - 150px)}
  .action{grid-template-columns:1fr}
  .reward-grid{grid-template-columns:repeat(3,1fr)}
  .reward-card{min-height:110px;font-size:30px}
}
</style>
</head>
<body>
<div class="bg">
  <div class="logo-bg">WildSnake</div>
  <i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><i class="dot d4"></i><i class="dot d5"></i>
</div>

<main class="wrap">
<section class="card">
  <div class="top">
    <div class="brand">Wild<span>Snake</span> • TUTORIAL</div>
    <div class="room-chip hidden" id="roomChip"></div>
  </div>

  <div class="progress"><i id="bar"></i></div>

  <div class="stage">
    <div class="kicker" id="kicker">PASSO 1 DE 6</div>
    <h1 id="title">Bem-vindo ao WildSnake</h1>
    <p class="desc" id="desc">Aprenda o básico em poucos passos. Ao terminar, seu bônus inicial será liberado pelo servidor.</p>

    <div id="demoArea" class="demo">
      <div class="snake"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
      <i class="food f1"></i><i class="food f2"></i><i class="food f3"></i>
    </div>

    <div id="controls" class="controls">
      <span class="key">W / ↑</span><span class="key">A / ←</span><span class="key">S / ↓</span><span class="key">D / →</span>
    </div>

    <div id="rewardArea" class="hidden">
      <div class="reward-grid">
        <button class="reward-card" data-card="0">?</button>
        <button class="reward-card" data-card="1">?</button>
        <button class="reward-card" data-card="2">?</button>
      </div>
      <div class="reward-result hidden" id="rewardResult"></div>
    </div>

    <div id="finishArea" class="hidden">
      <div class="finish-icon">🎉</div>
    </div>

    <div class="action">
      <button class="btn secondary" id="backBtn">VOLTAR</button>
      <button class="btn primary" id="nextBtn">COMEÇAR</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</section>
</main>

<script>
const AUTH_KEY="wildsnakeAuthV13";
const ROOM_KEY="wildsnakeQrPendingRoomV1";
let auth={mode:"none",token:null,account:null};
let step=0;
let selectedReward=null;
let rewardClaimed=false;
let busy=false;

const steps=[
  {
    title:"Bem-vindo ao WildSnake",
    desc:"Aprenda o básico em poucos passos. Ao terminar, seu bônus inicial será liberado pelo servidor.",
    next:"COMEÇAR"
  },
  {
    title:"Movimente sua cobra",
    desc:"No PC, use o mouse ou as teclas. No celular, use o controle de toque. Sua cobra segue a direção escolhida.",
    next:"ENTENDI"
  },
  {
    title:"Coma para crescer",
    desc:"Pegue os pontos coloridos espalhados pelo mapa. Eles aumentam seu tamanho e ajudam você a subir no ranking.",
    next:"PRÓXIMO"
  },
  {
    title:"Use o BOOST com cuidado",
    desc:"O boost aumenta sua velocidade, mas deve ser usado com estratégia. Evite bater em outras cobras.",
    next:"PRÓXIMO"
  },
  {
    title:"Sobreviva e domine",
    desc:"Faça outras cobras baterem no seu corpo, colete a comida deixada por elas e tente ficar no topo do ranking.",
    next:"PEGAR MEU BÔNUS"
  },
  {
    title:"Escolha uma caixa",
    desc:"Seu prêmio é decidido e validado pelo servidor. Cada conta recebe o bônus do tutorial apenas uma vez.",
    next:""
  },
  {
    title:"Tutorial concluído!",
    desc:"Seu bônus foi entregue. Se você veio por um QR de sala privada, vamos conectar você automaticamente agora.",
    next:"ENTRAR NA SALA"
  }
];

function loadAuth(){
  try{auth={...auth,...JSON.parse(localStorage.getItem(AUTH_KEY)||"{}")}}catch{}
}
function roomCode(){
  try{
    const q=new URLSearchParams(location.search).get("room");
    if(/^WILD-[A-Z0-9]{4}$/i.test(q||"")) return q.toUpperCase();
    const s=JSON.parse(localStorage.getItem(ROOM_KEY)||"null");
    if(/^WILD-[A-Z0-9]{4}$/i.test(s?.code||"")) return String(s.code).toUpperCase();
  }catch{}
  return "";
}
function headers(){
  return auth.token?{Authorization:"Bearer "+auth.token,"Content-Type":"application/json"}:{"Content-Type":"application/json"};
}
async function api(url,method="GET",body){
  try{
    const r=await fetch(url,{method,headers:headers(),body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
    const d=await r.json().catch(()=>({}));
    return{ok:r.ok&&d?.ok!==false,data:d,status:r.status};
  }catch(e){return{ok:false,data:{error:"Servidor indisponível."},status:0}}
}
function setStatus(text,error=false){
  const el=document.getElementById("status");el.textContent=text||"";el.classList.toggle("error",error);
}
function render(){
  const s=steps[step];
  document.getElementById("kicker").textContent=step<6?`PASSO ${Math.min(step+1,6)} DE 6`:"CONCLUÍDO";
  document.getElementById("title").textContent=s.title;
  document.getElementById("desc").textContent=s.desc;
  document.getElementById("bar").style.width=`${Math.min(100,((step+1)/7)*100)}%`;
  document.getElementById("nextBtn").textContent=s.next||"";
  document.getElementById("nextBtn").classList.toggle("hidden",step===5);
  document.getElementById("backBtn").classList.toggle("hidden",step===0||step>=5);
  document.getElementById("demoArea").classList.toggle("hidden",step>=5);
  document.getElementById("controls").classList.toggle("hidden",step!==1);
  document.getElementById("rewardArea").classList.toggle("hidden",step!==5);
  document.getElementById("finishArea").classList.toggle("hidden",step!==6);
}
async function startTutorial(){
  const r=await api("/api/tutorial/start","POST",{});
  if(!r.ok && r.data?.code!=="TUTORIAL_ALREADY_COMPLETED"){
    setStatus(r.data?.error||"Não foi possível iniciar o tutorial.",true);
    return false;
  }
  if(r.data?.code==="TUTORIAL_ALREADY_COMPLETED"){
    rewardClaimed=true;step=6;render();setStatus("Você já recebeu o bônus deste tutorial.");return false;
  }
  return true;
}
function rewardText(reward){
  if(!reward) return "Prêmio preparado";
  if(reward.type==="coins") return `🪙 ${Number(reward.amount||0).toLocaleString("pt-BR")} WildCoins`;
  if(reward.type==="gems") return `💎 ${Number(reward.amount||0).toLocaleString("pt-BR")} WildGems`;
  if(reward.type==="skin"){
    if(reward.skinName) return `🎨 ${reward.skinName}`;
    return "🎨 Skin surpresa";
  }
  return "🎁 Bônus WildSnake";
}
async function chooseReward(index){
  if(busy||selectedReward)return;
  busy=true;setStatus("Abrindo a caixa...");
  document.querySelectorAll(".reward-card").forEach((b,i)=>b.classList.toggle("selected",i===index));
  let r=await api("/api/tutorial/reward/select","POST",{cardIndex:index});
  if(!r.ok){setStatus(r.data?.error||"Não foi possível abrir a caixa.",true);busy=false;return}
  selectedReward=r.data?.reward||null;
  if(selectedReward?.type==="skin" && selectedReward?.awaitingRoll){
    setStatus("Girando a roleta de skin...");
    const roll=await api("/api/tutorial/reward/roll-skin","POST",{});
    if(!roll.ok){setStatus(roll.data?.error||"Não foi possível sortear a skin.",true);busy=false;return}
    selectedReward=roll.data?.reward||selectedReward;
  }
  const result=document.getElementById("rewardResult");
  result.innerHTML=`<strong>${rewardText(selectedReward)}</strong><span>Prêmio escolhido. Toque abaixo para resgatar.</span>`;
  result.classList.remove("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("nextBtn").textContent="RESGATAR BÔNUS";
  setStatus("Prêmio pronto para resgate ✓");
  busy=false;
}
async function claim(){
  if(busy)return;
  busy=true;setStatus("Entregando o bônus...");
  const r=await api("/api/tutorial/reward/claim","POST",{});
  if(!r.ok){setStatus(r.data?.error||"Não foi possível entregar o bônus.",true);busy=false;return}
  if(r.data?.account){
    auth.account={...(auth.account||{}),...r.data.account};
    try{localStorage.setItem(AUTH_KEY,JSON.stringify(auth))}catch{}
  }
  rewardClaimed=true;step=6;render();setStatus("Bônus entregue com sucesso ✓");busy=false;
}
function finish(){
  const room=roomCode();
  if(room){
    try{localStorage.setItem(ROOM_KEY,JSON.stringify({code:room,qr:true,autoJoin:true,savedAt:Date.now()}))}catch{}
    location.href=`/?room=${encodeURIComponent(room)}&qr=1&autojoin=1`;
  }else{
    location.href="/";
  }
}

document.querySelectorAll(".reward-card").forEach(btn=>btn.onclick=()=>chooseReward(Number(btn.dataset.card)));
document.getElementById("backBtn").onclick=()=>{if(step>0&&step<5){step--;render();setStatus("")}};
document.getElementById("nextBtn").onclick=async()=>{
  if(busy)return;
  if(step===0){
    const ok=await startTutorial();
    if(!ok && step===6)return;
    if(!ok)return;
    step=1;render();return;
  }
  if(step<4){step++;render();setStatus("");return}
  if(step===4){step=5;render();setStatus("Escolha uma das três caixas.");return}
  if(step===5){await claim();return}
  if(step===6){finish()}
};

(async()=>{
  loadAuth();
  const room=roomCode();
  if(room){const chip=document.getElementById("roomChip");chip.textContent="SALA "+room;chip.classList.remove("hidden")}
  if(!auth.token){setStatus("Sua sessão não foi encontrada. Voltando ao jogo...",true);setTimeout(()=>location.href=room?`/?room=${encodeURIComponent(room)}&qr=1`:"/",1400);return}
  const status=await api("/api/tutorial/status");
  if(!status.ok){setStatus(status.data?.error||"Não foi possível validar sua conta.",true);return}
  if(status.data?.tutorialStatus==="skipped"){
    rewardClaimed=false;
    step=6;
    render();
    setStatus("Você escolheu entrar na sala sem fazer o tutorial. O tutorial e o bônus não estão mais disponíveis para esta conta.",true);
    return;
  }

  if(status.data?.tutorialCompleted){
    rewardClaimed=true;
    step=6;
    render();
    setStatus("Você já concluiu o tutorial e recebeu o bônus.");
    return;
  }
  render();
})();
</script>
</body>
</html>
